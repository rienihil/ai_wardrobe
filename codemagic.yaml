workflows:
  ios-workflow:
    name: Flutter iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter clean
      - flutter pub get
      - flutter create .
      - cd ios && pod install --repo-update && cd ..
      - flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/ipa/**